<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Symbiotic Explorer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="toolbar">
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3.5l2.2-6.5 4.6 13 2.2-6.5H21"></path></svg></span>
    <span data-i18n="app.title"></span>
  </div>
  <span class="sep" aria-hidden="true"></span>
  <button id="refresh" type="button">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path></svg>
    <span data-i18n="action.refresh"></span>
  </button>
  <div class="spacer"></div>
  <span id="busy" class="muted" role="status"></span>
  <button id="open-tools" type="button" aria-haspopup="menu">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
    <span data-i18n="action.tools"></span>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
  </button>
  <button id="open-settings" type="button" class="iconbtn" data-i18n-title="action.settings" data-i18n-aria-label="action.settings">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
  </button>
</header>
<div class="body">
  <nav id="tree" class="side">
    <div id="tree-list" class="tree"></div>
    <div id="tree-foot" class="tree-foot"></div>
  </nav>
  <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-aria-label="tree.resize"></div>
  <main id="detail" class="detail"></main>
</div>
<footer class="statusbar">
  <span class="status-left">
    <button id="service" type="button" class="statuslink"></button>
    <span id="counts"></span>
  </span>
  <span id="toast" role="status"></span>
  <span class="spacer"></span>
  <span id="version"></span>
</footer>
<script src="common.js"></script>
<script src="pictures.js"></script>
<script src="share.js"></script>
<script src="app.js"></script>
</body>
</html>
